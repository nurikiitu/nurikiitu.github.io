<!DOCTYPE html>
<html lang="kk">
<head>
<meta charset="UTF-8">
<meta http-equiv="Cache-Control" content="no-cache">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Сабақ · NeuroUstaz</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{--ink:#1f2a44;--mut:#6b7590;--bg:#f4f6fb;--line:#e3e8f2;--brand:#5b4bdb;--brand2:#ff7a59;--ok:#22b07d;--bad:#ef5350}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{font-family:'Nunito',system-ui,sans-serif;color:var(--ink);background:var(--bg);overflow:hidden;user-select:none;-webkit-user-select:none}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
.top{height:74px;display:flex;align-items:center;gap:14px;padding:0 22px;background:#fff;border-bottom:2px solid var(--line);position:relative;z-index:5}
.pill{background:#fff;border:2px solid var(--line);padding:9px 18px;border-radius:999px;font-weight:800;font-size:18px;box-shadow:0 2px 0 var(--line);white-space:nowrap}
.pill:active{transform:translateY(2px);box-shadow:none}
.ltitle{min-width:0}
.ltitle small{display:block;font-size:13px;font-weight:800;color:var(--brand);text-transform:uppercase;letter-spacing:.5px}
.ltitle b{display:block;font-size:21px;font-weight:900;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:360px}
.chips{margin-left:auto;display:flex;gap:6px;align-items:center;overflow-x:auto;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{min-width:44px;height:44px;padding:0 10px;border-radius:14px;background:#f1f3f8;font-weight:900;font-size:18px;color:var(--mut);border:2px solid transparent;position:relative;flex:none}
.chip.x{background:#f3efff;color:#7a5cf0}
.chip.on{background:var(--brand);color:#fff}
.chip.dn::after{content:"✓";position:absolute;right:-5px;top:-6px;width:18px;height:18px;border-radius:50%;background:var(--ok);color:#fff;font-size:11px;display:grid;place-items:center}
.sep{width:2px;height:28px;background:var(--line);flex:none;margin:0 4px}
.main{position:absolute;top:74px;bottom:78px;left:0;right:0;overflow:hidden}
.stagew{position:absolute;left:50%;top:50%}
.stage{width:1500px;height:760px;transform-origin:0 0;position:relative}
#pen{position:absolute;inset:0;z-index:20;pointer-events:none;touch-action:none}
#pen.on{pointer-events:auto;cursor:crosshair}
.bot{position:absolute;bottom:0;left:0;right:0;height:78px;background:#fff;border-top:2px solid var(--line);display:flex;align-items:center;gap:10px;padding:0 22px;z-index:5}
.nav{height:54px;padding:0 24px;border-radius:16px;font-weight:900;font-size:20px;background:#f1f3f8}
.nav.nx{background:var(--brand);color:#fff;box-shadow:0 4px 0 #3e30b0}
.nav.nx.pulse{animation:pulse 1.2s infinite}
@keyframes pulse{50%{transform:scale(1.06)}}
.nav:disabled{opacity:.35}
.tools{margin:0 auto;display:flex;gap:8px;align-items:center;background:#f6f7fb;border-radius:18px;padding:6px}
.tb{width:50px;height:50px;border-radius:14px;font-size:24px;display:grid;place-items:center}
.tb.on{background:#fff;box-shadow:0 0 0 3px var(--brand)}
.col{width:30px;height:30px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 2px var(--line)}
.col.on{box-shadow:0 0 0 3px var(--ink)}
.ans{height:54px;padding:0 22px;border-radius:16px;font-weight:900;font-size:19px;background:#fff4d6;color:#8a5a00;border:2px solid #f3d27a}

/* task frame */
.task{position:absolute;inset:14px 18px 10px;display:flex;flex-direction:column;background:#fff;border-radius:30px;box-shadow:0 8px 30px #1f2a4414;border:3px solid var(--tc,#dfeccf)}
.tlabel{position:absolute;top:-17px;left:50%;transform:translateX(-50%);background:#fff;border:3px solid var(--tc,#dfeccf);border-radius:999px;padding:3px 18px;font-weight:900;font-size:15px;letter-spacing:.6px;color:#4b5563;white-space:nowrap}
.thead{display:flex;align-items:center;gap:18px;padding:20px 30px 16px;background:var(--th,#eef6e4);border-radius:27px 27px 0 0;flex:none}
.tnum{width:56px;height:56px;border-radius:50%;background:#fff;display:grid;place-items:center;font-size:30px;font-weight:900;color:var(--tn,#5c9e3a);flex:none;box-shadow:0 2px 0 #0001}
.ttxt{font-size:29px;font-weight:800;line-height:1.25}
.tbody{flex:1;min-height:0;position:relative;padding:18px 28px 20px;display:flex;gap:24px}
.k-pair{--tc:#c9def6;--th:#e7f1fc;--tn:#3b7dd8}
.k-self{--tc:#dadde3;--th:#eef0f3;--tn:#5f6b7a}
.k-life{--tc:#f4dc9c;--th:#fdf3d6;--tn:#c28a00}
.k-x{--tc:#d6ccff;--th:#f1edff;--tn:#6a4fe0}
.k-rem{--tc:#f5cfa6;--th:#fdebd7;--tn:#d9792b}
.k-new{--tc:#c9def6;--th:#e7f1fc;--tn:#3b7dd8}

/* common widgets */
.ncards{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.nc{width:84px;height:92px;border-radius:16px;font-size:52px;font-weight:900;color:#2a2a2a;background:var(--c);box-shadow:inset 0 -8px 0 #0002,0 4px 0 #0002;display:grid;place-items:center;transition:transform .1s}
.nc:active{transform:translateY(3px)}
.nc.sm{width:66px;height:72px;font-size:40px;border-radius:13px}
.opt{min-width:90px;height:84px;padding:0 24px;border-radius:20px;background:#fff;border:3px solid var(--line);box-shadow:0 5px 0 var(--line);font-size:30px;font-weight:900;display:inline-flex;align-items:center;justify-content:center;gap:10px}
.opt:active{transform:translateY(3px);box-shadow:0 2px 0 var(--line)}
.ok{box-shadow:0 0 0 5px var(--ok),0 0 24px #22b07d88!important;animation:pop .35s}
.bad{animation:shake .45s;box-shadow:0 0 0 5px var(--bad)!important}
.hint{box-shadow:0 0 0 6px #ffc531,0 0 30px #ffc531!important}
@keyframes pop{50%{transform:scale(1.12)}}
@keyframes shake{20%,60%{transform:translateX(-10px)}40%,80%{transform:translateX(10px)}}
.dots{display:block;background:#fff;border:3px solid #d8dbe3;border-radius:14px}
.qline{font-size:34px;font-weight:900;text-align:center}
.prog{display:flex;gap:8px;justify-content:center}
.prog i{width:16px;height:16px;border-radius:50%;background:#e3e7f0}
.prog i.d{background:var(--ok)}.prog i.c{background:var(--brand)}
.toast{position:absolute;left:50%;bottom:22px;transform:translateX(-50%);background:var(--ok);color:#fff;font-weight:900;font-size:28px;padding:12px 30px;border-radius:999px;z-index:30;animation:tin .3s;box-shadow:0 8px 20px #22b07d55;pointer-events:none}
@keyframes tin{from{opacity:0;transform:translate(-50%,20px)}}
.scene{position:relative;border-radius:22px;overflow:hidden;flex:none}
.it{position:absolute;transform:translate(-50%,-50%);line-height:1;cursor:pointer;transition:transform .15s}
.it:active{transform:translate(-50%,-50%) scale(.92)}
.bdg{position:absolute;right:-10px;top:-10px;min-width:30px;height:30px;border-radius:15px;background:var(--brand);color:#fff;font-size:18px;font-weight:900;display:grid;place-items:center;padding:0 6px;box-shadow:0 2px 6px #0004;font-family:Nunito}
.side{flex:1;display:flex;flex-direction:column;gap:18px;justify-content:center;align-items:center;min-width:0}
.big{font-size:40px;font-weight:900}
.mut{color:var(--mut);font-weight:800}
.picker{position:absolute;z-index:25;background:#fff;border-radius:22px;padding:14px;box-shadow:0 12px 40px #0003;display:flex;gap:8px;flex-wrap:wrap;width:min-content;min-width:300px;justify-content:center}
.slot{width:76px;height:76px;border-radius:16px;border:4px dashed #b9c1d3;background:#fafbfe;font-size:42px;font-weight:900;display:grid;place-items:center}
.slot.f{border-style:solid;border-color:#8f84f0;background:#f3f1ff}
.slot.sel{box-shadow:0 0 0 5px #ffc531}
.endov{position:absolute;inset:0;background:#1f2a44cc;display:grid;place-items:center;z-index:28;animation:tin .3s}
.endbox{background:#fff;border-radius:34px;padding:40px 60px;text-align:center;min-width:560px}
.endbox .em{font-size:90px}
.endbox h2{font-size:44px;font-weight:900;margin:6px 0}
.endbox p{font-size:26px;font-weight:800;color:var(--mut);margin-bottom:24px}
.endbox .row{display:flex;gap:14px;justify-content:center}
.btn{height:64px;padding:0 30px;border-radius:18px;font-weight:900;font-size:24px;background:var(--brand);color:#fff;box-shadow:0 5px 0 #3e30b0}
.btn.alt{background:#f1f3f8;color:var(--ink);box-shadow:0 5px 0 #dfe3ec}
.btn:active{transform:translateY(3px);box-shadow:none}
/* intro */
.intro{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;text-align:center}
.intro .no{width:120px;height:120px;border-radius:36px;background:linear-gradient(135deg,var(--brand),#8f6bff);color:#fff;font-size:70px;font-weight:900;display:grid;place-items:center;box-shadow:0 12px 24px #5b4bdb55}
.intro h1{font-size:64px;font-weight:900;letter-spacing:-1px}
.goal{background:#e7f1fc;border:3px solid #c9def6;border-radius:26px;padding:18px 36px;font-size:30px;font-weight:800;position:relative}
.goal span{position:absolute;top:-16px;left:50%;transform:translateX(-50%);background:#fff;border:3px solid #c9def6;border-radius:999px;padding:2px 16px;font-size:14px;letter-spacing:.6px;white-space:nowrap}
.plan{display:flex;gap:14px;flex-wrap:wrap;justify-content:center}
.plan div{background:#f6f7fb;border-radius:18px;padding:12px 20px;font-size:21px;font-weight:800;color:var(--mut)}
/* duel */
.duel{position:absolute;inset:0;display:flex;flex-direction:column}
.rope{height:120px;position:relative;flex:none;background:linear-gradient(90deg,#ffe3e3 0 50%,#e0ecff 50%);border-radius:24px;margin:10px 20px 0;overflow:hidden}
.rope .mid{position:absolute;left:50%;top:10px;bottom:10px;width:4px;background:#1f2a4433;transform:translateX(-50%)}
.rope .zone{position:absolute;top:0;bottom:0;width:13%;}
.rope .zl{left:0;background:#ef535033}.rope .zr{right:0;background:#3b7dd833}
.rope .r{position:absolute;left:50%;top:50%;width:110%;transform:translate(-50%,-50%);display:flex;align-items:center;justify-content:center;transition:transform .45s cubic-bezier(.3,1.6,.5,1)}
.rope .r .line{height:10px;width:62%;background:repeating-linear-gradient(90deg,#b07a3c 0 14px,#8c5a24 14px 28px);border-radius:6px}
.rope .r .tm{font-size:50px}
.rope .r .knot{position:absolute;left:50%;transform:translateX(-50%);font-size:40px}
.dsides{flex:1;display:flex;gap:18px;padding:14px 20px 10px;min-height:0}
.ds{flex:1;border-radius:26px;padding:16px;display:flex;flex-direction:column;align-items:center;gap:14px;border:4px solid}
.ds.s0{background:#fff5f5;border-color:#ffcdd2}.ds.s1{background:#f3f8ff;border-color:#c5dcff}
.ds .h{font-size:26px;font-weight:900}
.ds .q{flex:1;display:grid;place-items:center;width:100%;min-height:0}
.ds .os{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
.ds.lock{opacity:.5}
.ds.win{box-shadow:0 0 0 6px #ffc531,0 0 40px #ffc531}
.grp{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;align-content:center;background:#fff;border-radius:18px;padding:10px;border:3px solid var(--line)}
@media (max-width:900px){.top{padding:0 10px;gap:8px}.ltitle{display:none}.bot{padding:0 8px;gap:6px}.nav{padding:0 12px;font-size:16px}.nav span{display:none}.ans{padding:0 10px;font-size:15px}.tb{width:38px;height:38px;font-size:19px}.col{width:22px;height:22px}}
</style>
</head>
<body>
<div class="top">
 <button class="pill" id="back">⬅ Артқа</button>
 <div class="ltitle"><small id="llab"></small><b id="ltit"></b></div>
 <div class="chips" id="chips"></div>
</div>
<div class="main" id="main">
 <div class="stagew" id="sw"><div class="stage" id="stage"></div></div>
 <canvas id="pen"></canvas>
</div>
<div class="bot">
 <button class="nav" id="prev">‹ <span>Алдыңғы</span></button>
 <div class="tools">
  <button class="tb" id="tPen" title="Қалам">✏️</button>
  <button class="col on" style="background:#e53935" data-c="#e53935"></button>
  <button class="col" style="background:#1e63d6" data-c="#1e63d6"></button>
  <button class="col" style="background:#1b9e5a" data-c="#1b9e5a"></button>
  <button class="col" style="background:#222" data-c="#222"></button>
  <button class="tb" id="tEr" title="Өшіргіш">🧽</button>
  <button class="tb" id="tClr" title="Тазалау">🗑️</button>
 </div>
 <button class="ans" id="ans">👁 Жауабы</button>
 <button class="nav nx" id="next"><span>Келесі</span> ›</button>
</div>
<script src="data.js?v=3"></script>
<script>
/* ====== негізгі көмекшілер ====== */
const $=s=>document.querySelector(s);
const el=(t,c,h)=>{const e=document.createElement(t);if(c)e.className=c;if(h!=null)e.innerHTML=h;return e};
const rnd=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const shuffle=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const pick=(a,n)=>shuffle(a).slice(0,n);
const ORD=['','бірінші','екінші','үшінші','төртінші','бесінші','алтыншы','жетінші','сегізінші','тоғызыншы','оныншы'];
const ORDS=['','1-ші','2-ші','3-ші','4-ші','5-ші','6-шы','7-ші','8-ші','9-шы','10-шы'];
const NCOL=['','#e8836f','#f2b56b','#8b86e6','#86c47a','#7ec0ee','#f7dc6f','#f19cc6','#c9a3a8','#b59be0','#d4e57e'];
let AC=null;
function beep(k){try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();const o=AC.createOscillator(),g=AC.createGain();o.connect(g);g.connect(AC.destination);const t=AC.currentTime;
 const F={ok:[660,880],bad:[220,160],tap:[520,520],win:[523,784]}[k]||[500,500];o.frequency.setValueAtTime(F[0],t);o.frequency.linearRampToValueAtTime(F[1],t+.15);o.type=k==='bad'?'sawtooth':'sine';
 g.gain.setValueAtTime(.12,t);g.gain.exponentialRampToValueAtTime(.001,t+(k==='win'?.5:.25));o.start(t);o.stop(t+.5)}catch(e){}}

/* нүктелер (тас сияқты) */
const DOTP={1:[[50,50]],2:[[28,28],[72,72]],3:[[25,25],[50,50],[75,75]],4:[[28,28],[72,28],[28,72],[72,72]],5:[[25,25],[75,25],[50,50],[25,75],[75,75]],
 6:[[30,22],[70,22],[30,50],[70,50],[30,78],[70,78]],7:[[30,22],[70,22],[30,50],[70,50],[30,78],[70,78],[50,50]],8:[[30,16],[70,16],[30,39],[70,39],[30,62],[70,62],[30,85],[70,85]],
 9:[[22,22],[50,22],[78,22],[22,50],[50,50],[78,50],[22,78],[50,78],[78,78]],10:[[20,20],[40,20],[60,20],[80,20],[30,42],[50,42],[70,42],[40,64],[60,64],[50,86]]};
function dots(n,s=90){if(n===10)return `<svg class="dots" width="${s}" height="${s}" viewBox="0 0 100 100">${[[50,16],[40,36],[60,36],[30,56],[50,56],[70,56],[20,78],[40,78],[60,78],[80,78]].map(p=>`<circle cx="${p[0]}" cy="${p[1]}" r="7.5" fill="#222"/>`).join('')}</svg>`;
 return `<svg class="dots" width="${s}" height="${s}" viewBox="0 0 100 100">${(DOTP[n]||[]).map(p=>`<circle cx="${p[0]}" cy="${p[1]}" r="9" fill="#222"/>`).join('')}</svg>`}
/* саусақтар */
function hand1(n,s){const F=[[13,30],[24,24],[35,26],[46,32]];let h='';const sk='#f6c89f',st='#c98a5a';
 F.forEach((f,i)=>{const up=i<n;h+=`<rect x="${f[0]-5}" y="${up?f[1]-22:44}" width="10" height="${up?44:14}" rx="5" fill="${sk}" stroke="${st}" stroke-width="2"/>`});
 const th=n>=5;h+=th?`<rect x="-2" y="40" width="10" height="30" rx="5" fill="${sk}" stroke="${st}" stroke-width="2" transform="rotate(-38 3 70)"/>`:'';
 h+=`<rect x="6" y="44" width="46" height="34" rx="13" fill="${sk}" stroke="${st}" stroke-width="2"/>`;if(!th)h+=`<ellipse cx="20" cy="56" rx="11" ry="5" fill="${sk}" stroke="${st}" stroke-width="2"/>`;
 return `<svg width="${s*.75}" height="${s}" viewBox="-6 -2 62 82">${h}</svg>`}
const hand=(n,s=80)=>n<=5?hand1(n,s):hand1(5,s)+hand1(n-5,s);
/* қарапайым суреттер */
const ICO={
 eraser:`<svg viewBox="0 0 80 40" width="70"><g transform="rotate(-15 40 20)"><rect x="6" y="8" width="36" height="24" rx="5" fill="#ef7f8f"/><rect x="40" y="8" width="34" height="24" rx="5" fill="#5aa9e6"/></g></svg>`,
 sharp:`<svg viewBox="0 0 60 50" width="56"><rect x="6" y="10" width="46" height="32" rx="6" fill="#e53935"/><rect x="10" y="18" width="20" height="16" rx="3" fill="#b71c1c"/><circle cx="42" cy="26" r="5" fill="#888"/></svg>`,
 pcase:`<svg viewBox="0 0 110 50" width="110"><rect x="4" y="8" width="102" height="34" rx="17" fill="#8bc34a"/><rect x="14" y="10" width="82" height="5" rx="2" fill="#689f38"/><circle cx="96" cy="13" r="4" fill="#fbc02d"/></svg>`,
 cube:l=>`<svg viewBox="0 0 60 60" width="60"><rect x="6" y="10" width="42" height="42" rx="6" fill="#ffe08a" stroke="#d9a400" stroke-width="3"/><path d="M6 16 L16 4 H56 L48 14" fill="#ffd25c" stroke="#d9a400" stroke-width="3"/><text x="27" y="42" font-size="28" font-weight="900" text-anchor="middle" fill="#d83a3a" font-family="Nunito">${l}</text></svg>`,
 album:`<svg viewBox="0 0 100 70" width="110"><rect x="3" y="3" width="94" height="64" rx="5" fill="#ffd27a" stroke="#e0a030" stroke-width="3"/><circle cx="25" cy="25" r="9" fill="#ff7043"/><path d="M14 58 L38 34 L56 52 L70 40 L88 58Z" fill="#43a047"/><text x="60" y="24" font-size="11" font-weight="900" fill="#7a4a00" font-family="Nunito">альбом</text></svg>`};
function ncard(n,cls=''){const b=el('button','nc '+cls,String(n));b.style.setProperty('--c',NCOL[n]||'#eee');b.dataset.v=n;return b}

/* ====== сабақ қозғалтқышы ====== */
const P=new URLSearchParams(location.search),G=+P.get('g')||1,SB=P.get('s')||'math',N=+P.get('n')||1;
$('#back').onclick=()=>{location.href='./#/'+G+'/'+SB};
let LES=null;(DATA[G+'/'+SB]?.q||[]).forEach(q=>q.ls.forEach(l=>{if(l.n===N)LES=l}));
$('#llab').textContent=`${G}-сынып · ${LES?LES.lab:N+'-сабақ'}`;$('#ltit').textContent=LES?LES.t:'';
document.title=(LES?LES.t:'Сабақ')+' · NeuroUstaz';

let STEPS=[],CUR=0,RID=0,SCALE=1,DONE=new Set(),ERR=0;
function LESSON(def){
 STEPS=[{kind:'intro',chip:'🎯',build:b=>intro(b,def)}];
 def.book.forEach((t,i)=>{if(t.rem)STEPS.push({kind:'rem',chip:'📌',label:'ЕСІҢДЕ САҚТА!',k:'rem',num:'!',title:t.rem.title,build:t.rem.build});
   if(t.build)STEPS.push({kind:'book',chip:t.num,...t})});
 STEPS.push({sep:1});
 def.extra.forEach((t,i)=>STEPS.push({kind:'x',chip:'★'+(i+1),label:'⭐ КҮРДЕЛІ ТАПСЫРМА',k:'x',num:'★',...t}));
 STEPS.push({sep:1});
 STEPS.push({kind:'duel',chip:'⚔️',build:b=>duel(b,def.duel)});
 def.games.forEach(g=>STEPS.push({kind:'game',chip:g.icon,build:b=>g.build(b,T)}));
 STEPS=STEPS;chips();go(0)}
function realSteps(){return STEPS.filter(s=>!s.sep)}
function chips(){const c=$('#chips');c.innerHTML='';let i=0;STEPS.forEach(s=>{if(s.sep){c.append(el('div','sep'));return}const k=i++;
 const b=el('button','chip'+(s.kind==='x'?' x':''),s.chip);b.onclick=()=>go(k);c.append(b)});mark()}
function mark(){const bs=[...document.querySelectorAll('.chip')];bs.forEach((b,i)=>{b.classList.toggle('on',i===CUR);b.classList.toggle('dn',DONE.has(i))});
 bs[CUR]?.scrollIntoView({inline:'nearest',block:'nearest'})}
function go(i){const S=realSteps();if(i<0||i>=S.length)return;CUR=i;RID++;clearPen();T.reveal=null;
 const st=$('#stage');st.innerHTML='';const s=S[i];
 if(s.title){const f=el('div','task k-'+(s.k||'book'));if(s.label)f.append(el('div','tlabel',s.label));
  f.append(el('div','thead',`<div class="tnum">${s.num}</div><div class="ttxt">${s.title}</div>`));const body=el('div','tbody');f.append(body);st.append(f);s.build(body,T)}
 else s.build(st,T);
 $('#prev').disabled=i===0;$('#next').disabled=i===S.length-1;$('#next').classList.remove('pulse');$('#ans').style.visibility=s.kind==='intro'?'hidden':'';mark()}
$('#prev').onclick=()=>go(CUR-1);$('#next').onclick=()=>go(CUR+1);
$('#ans').onclick=()=>{if(T.reveal){T.reveal();beep('tap')}else toast('Бұл жерде жауап ашық — талқылаңыз 🙂','#6b7590')};
function toast(t,c){const x=el('div','toast',t);if(c)x.style.background=c;$('#stage').append(x);setTimeout(()=>x.remove(),1600)}

const T={
 reveal:null,
 alive(){const id=RID;return()=>id===RID},
 later(fn,ms){const a=T.alive();setTimeout(()=>a()&&fn(),ms)},
 ok(e){e&&(e.classList.remove('bad'),e.classList.remove('ok'),void e.offsetWidth,e.classList.add('ok'));beep('ok')},
 bad(e){ERR++;e&&(e.classList.remove('bad'),void e.offsetWidth,e.classList.add('bad'));beep('bad');e&&setTimeout(()=>e.classList.remove('bad'),500)},
 done(msg){if(DONE.has(CUR))return;DONE.add(CUR);mark();beep('win');if(msg!==' ')toast(msg||'Жарайсың! ✓');$('#next').classList.add('pulse')},
 cards(host,{from=1,to=10,sm=false,onPick}={}){const r=el('div','ncards');for(let i=from;i<=to;i++){const b=ncard(i,sm?'sm':'');b.onclick=()=>onPick(i,b);r.append(b)}host.append(r);return r},
 /* сұрақтар тізбегі */
 series(host,items,{opts:defOpts,optHtml,onEach,end}={}){const top=el('div','prog');host.append(top);const qb=el('div','');qb.style.cssText='flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;width:100%';host.append(qb);
  const ob=el('div','ncards');host.append(ob);let k=0;items.forEach(()=>top.append(el('i')));
  const show=()=>{[...top.children].forEach((x,j)=>x.className=j<k?'d':j===k?'c':'');const it=items[k];qb.innerHTML='';ob.innerHTML='';
   if(typeof it.q==='function')it.q(qb);else qb.innerHTML=it.q;onEach&&onEach(it,k);
   const os=it.o||defOpts;os.forEach(v=>{let b;if(typeof v==='number'&&!optHtml&&!it.optHtml)b=ncard(v,os.length>6?'sm':'');else{b=el('button','opt',(it.optHtml||optHtml||(x=>x))(v));}
    b.dataset.v=v;b.onclick=()=>{if(b.dataset.lock)return;if(String(v)===String(it.a)){T.ok(b);[...ob.children].forEach(x=>x.dataset.lock=1);
     T.later(()=>{k++;if(k<items.length)show();else{[...top.children].forEach(x=>x.className='d');end?end():T.done()}},800)}else T.bad(b)};ob.append(b)})};
  T.reveal=()=>{[...ob.children].forEach(b=>{if(b.dataset.v===String(items[k]?.a))b.classList.add('hint')})};show()},
 picker(anchor,vals,html,onPick){document.querySelectorAll('.picker').forEach(p=>p.remove());const st=$('#stage'),r=anchor.getBoundingClientRect(),sr=st.getBoundingClientRect();
  const p=el('div','picker');vals.forEach(v=>{const b=typeof v==='number'&&!html?ncard(v,'sm'):el('button','opt',html?html(v):v);if(html||typeof v!=='number'){b.style.height='64px';b.style.minWidth='64px';b.style.fontSize='28px';b.style.padding='0 12px'}
   b.onclick=e=>{e.stopPropagation();p.remove();onPick(v)};p.append(b)});st.append(p);
  let x=(r.left-sr.left)/SCALE,y=(r.bottom-sr.top)/SCALE+8;const pw=p.offsetWidth,ph=p.offsetHeight;if(x+pw>1490)x=1490-pw;if(y+ph>750)y=(r.top-sr.top)/SCALE-ph-8;p.style.left=Math.max(10,x)+'px';p.style.top=Math.max(10,y)+'px';
  setTimeout(()=>document.addEventListener('pointerdown',function f(e){if(!p.contains(e.target)){p.remove();document.removeEventListener('pointerdown',f,true)}},true),0)},
 /* саналатын көрініс: заттарды басқанда нөмір шығады */
 scene(host,{w,h,bg,items,count=true}){const s=el('div','scene');s.style.cssText=`width:${w}px;height:${h}px;background:${bg}`;host.append(s);let c=0;
  const els=items.map(it=>{const e=el('div','it',it.e);e.style.left=it.x+'%';e.style.top=it.y+'%';e.style.fontSize=(it.s||60)+'px';if(it.st)e.style.cssText+=it.st;e.dataset.t=it.t||'';
   if(count)e.onclick=()=>{if(e.querySelector('.bdg')){e.querySelector('.bdg').remove();c--;return}c++;e.append(el('span','bdg',c));beep('tap')};s.append(e);return e});
  s.resetCount=()=>{c=0;s.querySelectorAll('.bdg').forEach(b=>b.remove())};s.els=els;return s},
 end(host,{em='🏆',title='Жарайсың!',text='',again}){const o=el('div','endov',`<div class="endbox"><div class="em">${em}</div><h2>${title}</h2><p>${text}</p><div class="row"><button class="btn">🔁 Қайтадан</button><button class="btn alt">Келесі ›</button></div></div>`);
  o.querySelector('.btn').onclick=()=>{o.remove();again()};o.querySelector('.alt').onclick=()=>go(CUR+1);host.append(o);T.done(' ')},
 errTxt(e){return e?`${e} рет қателестің`:'Бірде-бір қате жоқ! 🌟'}
};

function intro(box,def){const w=el('div','intro',`<div class="no">${N}</div><h1>${LES?LES.t:''}</h1>
 <div class="goal"><span>ЖАҢАНЫ ОҚЫП-ҮЙРЕНУ</span>${def.goal}</div>
 <div class="plan"><div>📘 Кітаптағы тапсырмалар: ${def.book.filter(b=>b.build).length}</div><div>⭐ Күрделі: ${def.extra.length}</div><div>⚔️ Жарыс</div><div>🎮 Ойын: ${def.games.length}</div></div>`);
 box.append(w);if(def.introExtra)def.introExtra(w,T);
 const b=el('button','btn','Бастау ›');b.style.marginTop='6px';b.onclick=()=>go(1);w.append(b)}

/* ====== 2 оқушы жарысы: арқан тартыс ====== */
function duel(box,def){const alive=T.alive();const GOAL=5;let pos=0,over=false,sc=[0,0];
 box.innerHTML='';const d=el('div','duel');box.append(d);
 const rope=el('div','rope',`<div class="zone zl"></div><div class="zone zr"></div><div class="mid"></div><div class="r"><span class="tm">🧒🧒</span><div class="line"></div><span class="tm">🧒🧒</span><span class="knot">🎀</span></div>`);d.append(rope);
 const sides=el('div','dsides');d.append(sides);
 const S=[0,1].map(i=>{const s=el('div','ds s'+i,`<div class="h">${i?'🔵 2-оқушы':'🔴 1-оқушы'} · <b class="sc">0</b></div><div class="q"></div><div class="os"></div>`);sides.append(s);return s});
 const draw=()=>{rope.querySelector('.r').style.transform=`translate(calc(-50% + ${pos*-7.2}%),-50%)`;S.forEach((s,i)=>s.querySelector('.sc').textContent=sc[i])};
 const ask=i=>{if(!alive()||over)return;const s=S[i];let t,g=0;do{t=def.gen()}while(s._l===t.q&&g++<6);s._l=t.q;s.querySelector('.q').innerHTML=t.q;const os=s.querySelector('.os');os.innerHTML='';
  shuffle(t.o).forEach(v=>{const b=typeof v==='number'&&!t.oh?ncard(v,'sm'):el('button','opt',t.oh?t.oh(v):v);if(t.oh){b.style.height='auto';b.style.padding='8px'}
   b.onclick=()=>{if(over||s.classList.contains('lock'))return;
    if(String(v)===String(t.a)){T.ok(b);sc[i]++;pos+=i?1:-1;draw();if(Math.abs(pos)>=GOAL)return win(i);setTimeout(()=>ask(i),450)}
    else{T.bad(b);s.classList.add('lock');setTimeout(()=>{s.classList.remove('lock');ask(i)},1300)}};os.append(b)})};
 function win(i){over=true;S[i].classList.add('win');T.end(box,{em:'🏆',title:(i?'🔵 2-оқушы':'🔴 1-оқушы')+' жеңді!',text:`🔴 ${sc[0]} : ${sc[1]} 🔵`,again:()=>duel(box,def)})}
 const head=el('div','',`<div class="qline" style="font-size:22px;color:var(--mut);margin-top:6px">⚔️ ${def.title}</div>`);d.prepend(head);
 draw();ask(0);ask(1)}

/* ====== масштаб ====== */
function fit(){const m=$('#main'),W=m.clientWidth,H=m.clientHeight;SCALE=Math.min(W/1500,H/760);const sw=$('#sw');sw.style.width=1500*SCALE+'px';sw.style.height=760*SCALE+'px';
 sw.style.marginLeft=-750*SCALE+'px';sw.style.marginTop=-380*SCALE+'px';$('#stage').style.transform=`scale(${SCALE})`;sizePen()}
addEventListener('resize',fit);

/* ====== қалам ====== */
const cv=$('#pen'),cx=cv.getContext('2d');let mode=null,color='#e53935',drawing=false,lp=null;
function sizePen(){const m=$('#main'),r=devicePixelRatio||1;const img=cv.width?cx.getImageData(0,0,cv.width,cv.height):null;cv.width=m.clientWidth*r;cv.height=m.clientHeight*r;cv.style.width=m.clientWidth+'px';cv.style.height=m.clientHeight+'px';cx.setTransform(r,0,0,r,0,0);}
function clearPen(){cx.save();cx.setTransform(1,0,0,1,0,0);cx.clearRect(0,0,cv.width,cv.height);cx.restore()}
function setMode(m){mode=mode===m?null:m;cv.classList.toggle('on',!!mode);$('#tPen').classList.toggle('on',mode==='pen');$('#tEr').classList.toggle('on',mode==='er')}
$('#tPen').onclick=()=>setMode('pen');$('#tEr').onclick=()=>setMode('er');$('#tClr').onclick=clearPen;
document.querySelectorAll('.col').forEach(b=>b.onclick=()=>{color=b.dataset.c;document.querySelectorAll('.col').forEach(x=>x.classList.toggle('on',x===b));if(mode!=='pen')setMode('pen')});
const pt=e=>{const r=cv.getBoundingClientRect();return[e.clientX-r.left,e.clientY-r.top]};
cv.addEventListener('pointerdown',e=>{drawing=true;lp=pt(e);cv.setPointerCapture(e.pointerId)});
cv.addEventListener('pointermove',e=>{if(!drawing)return;const p=pt(e);cx.globalCompositeOperation=mode==='er'?'destination-out':'source-over';cx.strokeStyle=color;cx.lineWidth=mode==='er'?40:6;cx.lineCap=cx.lineJoin='round';
 cx.beginPath();cx.moveTo(lp[0],lp[1]);cx.lineTo(p[0],p[1]);cx.stroke();lp=p});
['pointerup','pointercancel'].forEach(k=>cv.addEventListener(k,()=>drawing=false));
T.pen=()=>{if(mode!=='pen')setMode('pen')};

/* ====== жүктеу ====== */
fit();
const sc=document.createElement('script');sc.src=`lessons/${G}-${SB}-${N}.js?v=3`;
sc.onerror=()=>{$('#stage').innerHTML=`<div class="intro"><div class="no">${N}</div><h1>${LES?LES.t:''}</h1><div style="font-size:90px">🛠️</div><div class="big mut">Сабақ дайындалуда</div></div>`;
 document.querySelector('.bot').style.display='none';$('#main').style.bottom='0';fit()};
document.body.append(sc);
</script>
