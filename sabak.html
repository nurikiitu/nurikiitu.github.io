<!DOCTYPE html>
<html lang="kk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Сабақ · NeuroUstaz</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{--ink:#1f2a44;--mut:#6b7590;--bg:#f4f6fb;--line:#e3e8f2;--brand:#5b4bdb;--brand2:#ff7a59}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:'Nunito',system-ui,sans-serif;color:var(--ink);background:var(--bg);display:flex;flex-direction:column;user-select:none}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
header{display:flex;align-items:center;gap:16px;padding:18px 32px}
.back{background:#fff;border:2px solid var(--line);padding:10px 20px;border-radius:999px;font-weight:800;font-size:20px;box-shadow:0 2px 0 var(--line)}
.logo{display:flex;align-items:center;gap:12px;font-weight:900;font-size:28px}
.logo .mk{width:46px;height:46px;border-radius:14px;background:linear-gradient(135deg,var(--brand),#8f6bff);display:grid;place-items:center;font-size:24px}
.logo b{color:var(--brand)}.logo i{font-style:normal;color:var(--brand2)}
.crumbs{margin-left:auto;color:var(--mut);font-weight:700;font-size:18px}
main{flex:1;display:grid;place-items:center;padding:20px;text-align:center}
.lab{display:inline-block;background:#efecff;color:var(--brand);font-weight:900;font-size:22px;padding:8px 20px;border-radius:999px}
h1{font-size:52px;font-weight:900;margin:16px 0 30px;letter-spacing:-1px}
.soon{font-size:90px}
.soon+p{font-size:26px;color:var(--mut);font-weight:800;margin-top:10px}
@media (max-width:900px){header{padding:14px 16px}.crumbs{display:none}h1{font-size:30px}}
</style>
</head>
<body>
<header>
 <button class="back" id="back">⬅ Артқа</button>
 <div class="logo"><div class="mk">🧠</div><span><b>Neuro</b><i>Ustaz</i></span></div>
 <div class="crumbs" id="crumbs"></div>
</header>
<main id="main"></main>
<script src="data.js"></script>
<script>
const P=new URLSearchParams(location.search),g=+P.get('g')||1,s=P.get('s')||'math',n=+P.get('n')||1;
const sub=SUBJ(g).find(x=>x.id===s)||{t:''};
let les=null;(DATA[g+'/'+s]?.q||[]).forEach(q=>q.ls.forEach(l=>{if(l.n===n)les=l}));
document.getElementById('back').onclick=()=>{location.href='./#/'+g+'/'+s};
document.getElementById('crumbs').textContent=`${g}-сынып › ${sub.t}`;
document.title=(les?les.t:'Сабақ')+' · NeuroUstaz';
document.getElementById('main').innerHTML=`<div><span class="lab">${les?les.lab:n+'-сабақ'}</span><h1>${les?les.t:''}</h1><div class="soon">🛠️</div><p>Сабақ дайындалуда</p></div>`;
</script>
</body>
</html>
